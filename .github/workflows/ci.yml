name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile
      # VS Code needs a display server even to run tests headlessly.
      - run: xvfb-run -a npm test
      # Catch packaging errors (bad manifest, missing files) before publishing.
      - run: npx vsce package --out /tmp/ci-build.vsix
